# Publish crates.io packages + unsigned macOS CLI bins from annotated tags.
# Tags: v0.1.0  →  core, then interlace-cli, then interlace (D7).
# Desktop .app/.dmg is app-v* → app-release.yml (never this file).
# Secrets: CARGO_REGISTRY_TOKEN
name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  crates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish (core, cli, interlace)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo publish -p interlace-core --locked
          # crates.io index lag
          sleep 45
          cargo publish -p interlace-cli --locked
          sleep 15
          cargo publish -p interlace --locked

  macos-bin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: build release bins
        run: cargo build --release -p interlace -p interlace-cli --locked
      - name: GitHub Release (unsigned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          notes=$(awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md || true)
          gh release create "$tag" \
            target/release/interlace \
            target/release/interlace-cli \
            --title "$tag" \
            --notes "${notes:-Interlace $tag (unsigned macOS binaries; codesign later).}"
