[package]
name = "interlace-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Interlace macOS desktop shell (unpublished; not cargo install interlace)"

[[bin]]
name = "interlace-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = [
    "wry",
    "common-controls-v6",
] }
