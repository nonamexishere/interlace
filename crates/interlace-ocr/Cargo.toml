[package]
name = "interlace-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "On-device photo text for Interlace"

[dependencies]
interlace-core.workspace = true
image.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = { version = "0.3.2", features = ["objc2-core-graphics"] }

[build-dependencies]
cmake = "0.1"
cc = "1"

[dev-dependencies]
image.workspace = true
