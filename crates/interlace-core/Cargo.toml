[package]
name = "interlace-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core library for Interlace, a local-first archive that unifies conversations across platforms"
readme = "README.md"

[features]
default = ["bundled-sqlite"]
bundled-sqlite = ["rusqlite/bundled"]

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
zip.workspace = true
toml.workspace = true
mailparse.workspace = true
encoding_rs.workspace = true
data-encoding.workspace = true
clap.workspace = true
image.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-av-foundation = { version = "0.3.2", features = ["AVAsset", "AVAssetImageGenerator", "objc2-core-graphics", "objc2-core-media"] }
objc2-image-io = { version = "0.3.2", features = ["objc2-core-graphics"] }

[dev-dependencies]
rusqlite.workspace = true
interlace-fixtures = { path = "../interlace-fixtures" }

[[bench]]
name = "search"
harness = false
