[workspace]
resolver = "2"
members = [
    "crates/interlace-core",
    "crates/interlace",
    "crates/interlace-cli",
    "crates/interlace-cli-common",
]
default-members = [
    "crates/interlace-core",
    "crates/interlace",
    "crates/interlace-cli",
    "crates/interlace-cli-common",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nonamexishere/interlace"
rust-version = "1.80"
version = "0.0.1"

[workspace.dependencies]
interlace-core = { path = "crates/interlace-core", version = "0.0.1" }
interlace-cli-common = { path = "crates/interlace-cli-common", version = "0.0.1" }
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "blob", "backup", "hooks"] }
thiserror = "2"
libc = "0.2"
