[workspace]
resolver = "2"
members = [
    "crates/interlace-core",
    "crates/interlace",
    "crates/interlace-cli",
    "crates/interlace-cli-common",
    "crates/interlace-fixtures",
    "crates/interlace-tauri",
]
default-members = [
    "crates/interlace-core",
    "crates/interlace",
    "crates/interlace-cli",
    "crates/interlace-cli-common",
    "crates/interlace-fixtures",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nonamexishere/interlace"
rust-version = "1.80"
version = "0.1.0"

[workspace.dependencies]
interlace-core = { path = "crates/interlace-core", version = "0.1.0" }
interlace-cli-common = { path = "crates/interlace-cli-common", version = "0.1.0" }
rusqlite = { version = "0.32", default-features = false, features = ["bundled", "blob", "backup", "hooks"] }
thiserror = "2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = "0.8"
blake3 = "1"
mailparse = "0.16"
encoding_rs = "0.8"
data-encoding = "2"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
